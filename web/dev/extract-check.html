<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資料の展開 確認</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; max-width: 960px; }
  pre { background: #f3f4f6; padding: 12px; overflow: auto; max-height: 70vh; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  .meta { color: #374151; margin: 8px 0; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
<h1>資料の展開 確認</h1>
<p>pptx / xlsx を選ぶと、<code>extract.js</code> が作る JSON（サーバーへ送る内容）を表示します。土台（ログイン、API）には依存しません。</p>
<input type="file" id="f" accept=".pdf,.pptx,.xlsx,.ppt,.xls,.doc,.docx">
<div id="meta" class="meta"></div>
<pre id="out"></pre>
<script type="module">
import { extractMaterial } from '../js/materials/extract.js';
const meta = document.getElementById('meta');
const out = document.getElementById('out');
document.getElementById('f').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  meta.className = 'meta'; meta.textContent = '展開中…'; out.textContent = '';
  const t0 = performance.now();
  try {
    const r = await extractMaterial(file);
    const json = JSON.stringify(r, null, 2);
    const bytes = new TextEncoder().encode(JSON.stringify(r)).length;
    const list = r.slides || r.sheets || [];
    const charts = list.reduce((n, s) => n + (s.charts ? s.charts.length : 0), 0);
    meta.textContent = `${file.name}（${(file.size / 1048576).toFixed(2)}MB）→ ${r.kind} / JSON ${(bytes / 1024).toFixed(1)}KB / ${list.length} ${r.kind === 'xlsx' ? 'シート' : 'スライド'} / グラフ ${charts} / ${Math.round(performance.now() - t0)}ms${r.truncated ? ' / 切り詰めあり' : ''}`;
    out.textContent = json;
  } catch (err) {
    meta.className = 'meta err';
    meta.textContent = `${err.name}: ${err.message}`;
  }
});
</script>
</body>
</html>
